services:
  audiobooks-mongo:
    container_name: "audiobooks-mongo"
    image: "mongo"
    networks:
      - "audiobooks-mongo"
    volumes:
      - "${MONGO_STORAGE:-../db:/data/db}"
    restart: "always"
  audiobooks-backend:
    container_name: "audiobooks-backend"
    image: "node:24"
    depends_on:
      - "audiobooks-mongo"
    networks:
      - "audiobooks-mongo"
    ports:
      - "127.0.0.1:4001:4000"
    volumes:
      - "../:/mnt/"
    working_dir: "/mnt/backend"
    restart: "always"
    environment:
      TZ: "Europe/Moscow"
      # the published port arrives on the container address, not on its loopback
      LISTEN_ADDRESS: "0.0.0.0"
    command: >
      sh -c "ln -snf /usr/share/zoneinfo/$$TZ /etc/localtime && 
      echo $$TZ > /etc/timezone &&
      exec npm run start:prod"
networks:
  audiobooks-mongo: